bug fix:
- title: 'Commit the lunarref/_version.py placeholder'
  description: |
    ``lunarref/__init__.py`` imports ``__version__`` from ``_version.py``, but
    that file was never committed (it is listed in ``.gitignore``).
    ``poetry-dynamic-versioning`` only rewrites an existing ``_version.py`` and
    ``pip install -e`` does not create one, so after an editable install
    ``import lunarref`` failed with ``No module named 'lunarref._version'``.
    Because GeoIPS imports every plugin package at startup, this broke every
    ``geoips`` command, including ``geoips config create-registries``.

    Add the ``0.0.0`` placeholder ``_version.py`` (force-added past
    ``.gitignore``), matching the other GeoIPS plugin repos such as ``geocolor``.
  files:
    added:
    - 'lunarref/_version.py'
    - 'docs/source/releases/latest/add-version-file.yaml'
  related-issue:
    number: null
    repo_url: ''
  date:
    start: '10/05/2026'
    finish: '10/05/2026'
- title: 'Add the tests/conftest.py the other plugin repos have'
  description: |
    The GeoIPS CI runs plugin integration tests with
    ``--no-fail-on-missing-data``, an option the plugin's ``tests/conftest.py``
    adds. lunarref had none, so pytest stopped with "unrecognized arguments:
    --no-fail-on-missing-data". The conftest is the same as true_color's.
  files:
    added:
    - 'tests/conftest.py'
  related-issue:
    number: null
    repo_url: ''
  date:
    start: 2026-10-19
    finish: 2026-10-19
- title: 'Remove a duplicate documentation key from a 1.14.4 release note'
  description: |
    ``294-add-descriptions-to-tc-products-and-readers.yaml`` had a second, empty
    ``documentation`` section left over from the release note template. brassy
    rejects duplicate keys, so the docs build (``build_docs.sh``, run by the
    integration tests) failed.
  files:
    modified:
    - 'docs/source/releases/1.14.4/294-add-descriptions-to-tc-products-and-readers.yaml'
  related-issue:
    number: null
    repo_url: ''
  date:
    start: 2026-10-20
    finish: 2026-10-20
